<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>تحليل إنتاج البيض</title>

<style>
body {
    font-family: Arial;
    background: #f4f6f8;
    text-align: center;
    padding: 20px;
}
.container {
    background: white;
    max-width: 450px;
    margin: auto;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
input, select, button {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    font-size: 16px;
}
button {
    background: #27ae60;
    color: white;
    border: none;
    border-radius: 8px;
}
.gauge {
    width: 200px;
    height: 100px;
    background: #ddd;
    border-radius: 200px 200px 0 0;
    position: relative;
    overflow: hidden;
    margin: 20px auto;
}
.gauge-fill {
    height: 100%;
    background: red;
    transform-origin: center bottom;
    transform: rotate(0deg);
    transition: 0.6s;
}
.gauge-cover {
    width: 160px;
    height: 80px;
    background: white;
    border-radius: 160px 160px 0 0;
    position: absolute;
    bottom: 0;
    left: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}
.advice {
    text-align: right;
    margin-top: 15px;
    background: #f9f9f9;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
<h2>🐔 تحليل إنتاج البيض</h2>

<input type="number" id="hens" placeholder="عدد الدجاج">

<select id="type">
    <option value="baladi">بلدي</option>
    <option value="hybrid"> محسّن</option>
    <option value="layer">بياض</option>
</select>

<select id="period">
    <option value="day">يومي</option>
    <option value="month">شهري</option>
</select>

<input type="number" id="eggs" placeholder="عدد البيض">

<button onclick="calculate()">حلل الإنتاج</button>

<div class="gauge">
    <div class="gauge-fill" id="gaugeFill"></div>
    <div class="gauge-cover" id="gaugeText">0%</div>
</div>

<div id="status"></div>
<div class="advice" id="advice"></div>
</div>

<script>
function calculate() {

    let hens = Number(document.getElementById("hens").value);
    let eggs = Number(document.getElementById("eggs").value);
    let period = document.getElementById("period").value;
    let type = document.getElementById("type").value;

    if (hens <= 0 || eggs < 0) {
        alert("دخل معطيات صحيحة");
        return;
    }

    let maxEggs = (period === "day") ? hens : hens * 30;
    let percentage = Math.min((eggs / maxEggs) * 100, 100);

    let limits = {
        baladi: {low:35, mid:55},
        hybrid: {low:60, mid:75},
        layer: {low:65, mid:80}
    };

    let status = "";
    let color = "";
    let advice = "";

    if (percentage < limits[type].low) {
        status = "❌ إنتاج ضعيف";
        color = "red";
        advice = `
        🥣 العلف: زيد البروتين<br>
        💡 الضوء: 14 ساعة/اليوم<br>
        🩺 الصحة: راقب الأمراض والطفيليات
        `;
    } 
    else if (percentage < limits[type].mid) {
        status = "⚠️ إنتاج متوسط";
        color = "orange";
        advice = `
        🥣 العلف: حسن الكالسيوم<br>
        💡 الضوء: ثبت الإضاءة<br>
        🩺 الصحة: فيتامينات طبيعية
        `;
    } 
    else {
        status = "✅ إنتاج مزيان";
        color = "green";
        advice = `
        ✔️ حافظ على النظام الحالي<br>
        ✔️ نظافة وتهوية
        `;
    }

    document.getElementById("gaugeFill").style.transform =
        `rotate(${percentage * 1.8}deg)`;

    document.getElementById("gaugeFill").style.background = color;
    document.getElementById("gaugeText").innerText = percentage.toFixed(1) + "%";
    document.getElementById("status").innerText = status;
    document.getElementById("advice").innerHTML = advice;
}
</script>

</body>
</html>
